<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canonix — Bibliothèque numérique</title>
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Canonix">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f1;--panel:#fff;--ink:#111;--mute:#625c55;--line:#e3ded7;--acc:#f9813c;--accx:#b8480f;--acc2:#f9813c;--onacc:#111;--serif:'Newsreader',Georgia,serif;--sans:'Instrument Sans',system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e0e0e;--panel:#171717;--ink:#f4f1ec;--mute:#a39d95;--line:#2c2a28;--acc:#f9813c;--accx:#ff9a5c;--acc2:#f9813c;--onacc:#111}}
:root[data-theme=dark]{--bg:#0e0e0e;--panel:#171717;--ink:#f4f1ec;--mute:#a39d95;--line:#2c2a28;--acc:#f9813c;--accx:#ff9a5c;--acc2:#f9813c;--onacc:#111}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
a{color:inherit}h1,h2,h3{font-family:var(--serif);font-weight:500;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,6vw,4.2rem)}h2{font-size:1.9rem}h3{font-size:1.25rem}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
header{border-bottom:3px solid var(--acc);background:#0d0d0d;color:#f4f1ec;position:sticky;top:0;z-index:5}
header .w{display:flex;align-items:center;gap:20px;height:64px}
.logo{font:500 1.6rem var(--serif);text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:10px}.logo img{border-radius:50%}
nav{display:flex;gap:18px;align-items:center;font-size:.95rem}nav a{text-decoration:none;color:#b9b2a8}nav a:hover,nav a.on{color:#fff}nav svg{display:none}nav a.on{border-bottom:2px solid var(--acc2)}
button,.btn{font:500 .95rem var(--sans);background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:2px solid var(--accx);outline-offset:2px}button:hover,.btn:hover{filter:brightness(.94)}.box a:not(.btn),.sec>a.m{color:var(--accx);text-underline-offset:3px}.box a:not(.btn){text-decoration:underline}
input,select,textarea{font:inherit;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
textarea{min-height:110px}label{display:block;font-size:.88rem;color:var(--mute);margin:12px 0 4px}
.hero{padding:64px 0 40px}.hero p{max-width:52ch;color:var(--mute);font:italic 1.25rem/1.5 var(--serif)}
.sf{display:flex;gap:10px;max-width:560px;margin-top:24px}
.shelf{display:flex;align-items:flex-end;gap:6px;margin-top:44px;padding-bottom:10px;border-bottom:6px solid var(--ink);overflow-x:auto}
.spine{writing-mode:vertical-rl;transform:rotate(180deg);background:var(--c);color:#fff;font:500 1.05rem var(--serif);padding:18px 12px;border-radius:3px 3px 0 0;cursor:pointer;border:0;border-top:3px solid rgba(255,255,255,.35);transition:transform .2s;flex:none}
.spine:hover{transform:rotate(180deg) translateX(8px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;text-decoration:none;display:flex;flex-direction:column;gap:6px;border-left:5px solid var(--c,var(--acc))}
.card:hover{border-color:var(--acc)}.card small,.m{color:var(--mute);font-size:.88rem}
.sec{padding:36px 0}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;margin:16px 0}
.narrow{max-width:640px}.cm{border-top:1px solid var(--line);padding:12px 0}
.bar{background:var(--ink);color:var(--bg);padding:10px 0;font-size:.92rem}.bar .w{display:flex;gap:12px;align-items:center;justify-content:space-between}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:.9rem;margin-top:40px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:9}
@media(max-width:720px){.sf{flex-direction:column}body{padding-bottom:calc(68px + env(safe-area-inset-bottom,0))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);gap:0;background:#0d0d0d;border-top:3px solid var(--acc);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0));font-size:.72rem}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-radius:10px;border-bottom:0!important}nav a.on{color:var(--acc);font-weight:600}nav svg{display:block}.toast{bottom:calc(84px + env(safe-area-inset-bottom,0))}.hero{padding-top:36px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="inst" class="bar" hidden><div class="w"><span>Installez Canonix sur votre appareil pour y accéder hors connexion.</span><span class="row"><button data-a="install">Installer</button><button class="ghost" data-a="noinst" style="color:inherit;border-color:#888">Plus tard</button></span></div></div>
<header><div class="w"><a class="logo" href="#/"><img src="logo.svg" alt="" width="40" height="40">Canonix</a><nav id="nav"></nav></div></header>
<main class="w" id="app"></main>
<footer><div class="w row" style="justify-content:space-between"><span>Canonix — lire, chercher, partager.</span><button class="ghost" data-a="theme">Thème clair / sombre</button></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>

</body>
</html>
